<!DOCTYPE html>

<head>
  <title>Matrimony Profile Form</title>
</head>
<body>

  <h1>Marriage Matrimony</h1>
  <p>Create profile</p>

  <form>
    <label>Full Name:</label>
    <input type="text" name="name"><br>

    <label>Age:</label>
    <input type="number" name="age"><br>

    <label>Gender:</label>
    <select name="gender">
      <option>Male</option>
      <option>Female</option>
      <option>Other</option>
    </select><br><br>

    <label>Religion:</label>
    <input type="text" name="religion"><br><br>

    <label>Education:</label>
    <input type="text" name="education"><br><br>

    <label>Job:</label>
    <input type="text" name="job"><br><br>

    <label>Location:</label>
    <input type="text" name="location"><br><br>

    <label>About You:</label><br>
    <textarea name="about" rows="4" cols="30"></textarea><br><br>

    <button type="submit">Create Profile</button>
  </form>

</body>
</html>

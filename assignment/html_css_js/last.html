<!DOCTYPE html>
<html>
<head>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
    }

    .screen-split {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    .part {
      flex: 1;
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
    }

    .part-1 {
      background-color: #f4f0ea;
      justify-content: flex-end;
    }

    .part-2 {
      background-color: #1a3328;
      justify-content: flex-start;
    }

    .part-3 {
      background-color: #ded1be;
      justify-content: space-between;
    }

    .middle-container {
      width: 400px;
      height: 200px;
      background-color: #f4f0ea;
      border-radius: 30px;
      border: 4px solid white;
      margin-left: 40px;
    }

    .top-container {
      width: 400px;
      height: 200px;
      background-color: #ded1be;
      border-radius: 30px;
      margin-right: 40px;
      margin-top: 60px;
    }

    .bottom-container {
      width: 400px;
      height: 200px;
      background-color: #f4f0ea;
      border-radius: 30px;
      margin-right: 40px;
    }

    .anime-image {
      height: 90%;
      max-width: 300px;
      object-fit: contain;
      margin-left: 40px;
    }

    .top-bar {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
    }

    .logo-box {
      display: inline-block;
      background-color: white;
      padding: 10px 20px;
      border-radius: 8px;
    }

    .logo-box h1 {
      margin: 0;
      font-size: 24px;
      font-family: sans-serif;
      color: #1a3328;
    }

    .register-btn {
      float: right;
      background-color: white;
      color: #1a3328;
      padding: 12px 24px;
      border: none;
      border-radius: 50px;
      font-family: sans-serif;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="screen-split">
    <div class="part part-1">
      <div class="top-bar">
        <div class="logo-box">
          <h1>kekkon</h1>
        </div>
        <button class="register-btn">register</button>
      </div>
      <div class="top-container"></div>
    </div>
    
    <div class="part part-2">
      <div class="middle-container"></div>
    </div>
    
    <div class="part part-3">
      <img class="anime-image" src="https://via.placeholder.com/200x200" alt="anime">
      <div class="bottom-container"></div>
    </div>
  </div>

</body>
</html>

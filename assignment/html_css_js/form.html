<!DOCTYPE html>
<html>
<head>
    <title>Contact Form</title>
    <style>
        body {
            background: lightblue;
            font-family: Arial;
            text-align: center;
        }

        .box, .result {
            background: white;
            width: 320px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 8px;
            text-align: left;
        }

        .result {
            display: none;
        }

        input, select, textarea {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
            margin-top: 5px;
        }

        textarea {
            height: 70px;
        }

        .gender input {
            width: auto;
        }

        button, a {
            padding: 8px 15px;
            border: none;
            text-decoration: none;
            border-radius: 5px;
        }

        button {
            background: navy;
            color: white;
            width: 100%;
        }

        a {
            background: white;
            color: black;
        }

        h2 {
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>Contact Form</h2>
        <form>
            Name:
            <input type="text" id="name">

            Email:
            <input type="email" id="email">

            Gender:
            <div class="gender">
                <input type="radio" name="gender" value="Male"> Male
                <input type="radio" name="gender" value="Female"> Female
            </div>

            Country:
            <select id="country">
                <option>India</option>
                <option>USA</option>
                <option>UK</option>
            </select>

            Message:
            <textarea id="message"></textarea>

            <br>
            <button type="submit">Submit</button>
        </form>
    </div>

    <div class="result">
        <h2>Submitted Data</h2>
        <p>Name: <span id="d1"></span></p>
        <p>Email: <span id="d2"></span></p>
        <p>Gender: <span id="d3"></span></p>
        <p>Country: <span id="d4"></span></p>
        <p>Message: <span id="d5"></span></p>
    </div>

    <script>
        document.querySelector("form").addEventListener("submit", function(e) {
            e.preventDefault();

            d1.textContent = name.value;
            d2.textContent = email.value;

            let g = document.querySelector('input[name="gender"]:checked');
            d3.textContent = g ? g.value : "Not selected";

            d4.textContent = country.value;
            d5.textContent = message.value;

            document.querySelector(".box").style.display = "none";
            document.querySelector(".result").style.display = "block";
        });
    </script>

    <a href="https://shareeqshaikh.github.io/4-sem-fet/assignment/1.html">Home Page</a>

</body>
</html>

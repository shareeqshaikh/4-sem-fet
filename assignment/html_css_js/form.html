<!DOCTYPE html>
<html>
<head>
    <title>HTML Form Example</title>
    <style>
        body {
            background-color: lightblue;
            text-align: center;
        }

        .main, .main2 {
            background-color: white;
            padding: 20px;
            width: 400px;
            margin: auto;
            border-radius: 10px;
        }

        .main2 {
            display: none;
        }

        input, select, textarea {
            width: 200px;
            padding: 5px;
        }

        button, a {
            padding: 10px 20px;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="main">
        <h2>Contact Form</h2>

        <form>
            Name:<br>
            <input type="text" id="name"><br><br>

            Email:<br>
            <input type="email" id="email"><br><br>

            Phone:<br>
            <input type="text" id="phone"><br><br>

            Gender:<br>
            <input type="radio" name="gender" value="Male"> Male
            <input type="radio" name="gender" value="Female"> Female
            <br><br>

            Subscribe:<br>
            <input type="checkbox" id="subscribe"> Newsletter
            <br><br>

            Country:<br>
            <select id="country">
                <option>India</option>
                <option>USA</option>
                <option>UK</option>
            </select>
            <br><br>

            Message:<br>
            <textarea id="message"></textarea>
            <br><br>

            <button type="submit">Submit</button>
        </form>
    </div>

    <div class="main2">
        <h2>Submitted Data</h2>
        <p><b>Name:</b> <span id="display-name"></span></p>
        <p><b>Email:</b> <span id="display-email"></span></p>
        <p><b>Phone:</b> <span id="display-phone"></span></p>
        <p><b>Gender:</b> <span id="display-gender"></span></p>
        <p><b>Subscribed:</b> <span id="display-subscribe"></span></p>
        <p><b>Country:</b> <span id="display-country"></span></p>
        <p><b>Message:</b> <span id="display-message"></span></p>
    </div>

    <script>
        let form = document.querySelector("form");

        form.addEventListener("submit", function(e) {
            e.preventDefault();

            document.getElementById("display-name").textContent = document.getElementById("name").value;
            document.getElementById("display-email").textContent = document.getElementById("email").value;
            document.getElementById("display-phone").textContent = document.getElementById("phone").value;

            let gender = document.querySelector('input[name="gender"]:checked');
            document.getElementById("display-gender").textContent = gender ? gender.value : "Not selected";

            document.getElementById("display-subscribe").textContent =
                document.getElementById("subscribe").checked ? "Yes" : "No";

            document.getElementById("display-country").textContent = document.getElementById("country").value;
            document.getElementById("display-message").textContent = document.getElementById("message").value;

            document.querySelector(".main").style.display = "none";
            document.querySelector(".main2").style.display = "block";
        });
    </script>

    <br>
    <a href="https://sachinacharya28.github.io/SEM-4-FET/assignments/one.html">Home Page</a>

</body>
</html>

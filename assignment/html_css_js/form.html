<!DOCTYPE html>
<html>
<head>
    <title>Contact Form</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial;
            text-align: center;
        }

        .main, .main2 {
            background: white;
            width: 350px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid gray;
            text-align: left;
        }

        .main2 {
            display: none;
        }

        input, select, textarea {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
        }

        textarea {
            height: 80px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: darkblue;
            color: white;
            border: none;
            border-radius: 5px;
        }

        a {
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            background: white;
            color: black;
            border: 1px solid gray;
        }

        h2 {
            text-align: center;
        }

        .options {
            text-align: left;
        }
    </style>
</head>

<body>

    <div class="main">
        <h2>Contact Form</h2>

        <form>
            Name:<br>
            <input type="text" id="name"><br><br>

            Email:<br>
            <input type="email" id="email"><br><br>

            Phone:<br>
            <input type="text" id="phone"><br><br>

            Gender:<br>
            <div class="options">
                <input type="radio" name="gender" value="Male"> Male
                <input type="radio" name="gender" value="Female"> Female
            </div><br>

            Subscribe:<br>
            <div class="options">
                <input type="checkbox" id="subscribe"> Newsletter
            </div><br>

            Country:<br>
            <select id="country">
                <option>India</option>
                <option>USA</option>
                <option>UK</option>
            </select><br><br>

            Message:<br>
            <textarea id="message"></textarea><br><br>

            <button type="submit">Submit</button>
        </form>
    </div>

    <div class="main2">
        <h2>Submitted Data</h2>
        <p>Name: <span id="display-name"></span></p>
        <p>Email: <span id="display-email"></span></p>
        <p>Phone: <span id="display-phone"></span></p>
        <p>Gender: <span id="display-gender"></span></p>
        <p>Subscribed: <span id="display-subscribe"></span></p>
        <p>Country: <span id="display-country"></span></p>
        <p>Message: <span id="display-message"></span></p>
    </div>

    <script>
        let form = document.querySelector("form");

        form.addEventListener("submit", function(e) {
            e.preventDefault();

            display-name.textContent = name.value;
            display-email.textContent = email.value;
            display-phone.textContent = phone.value;
            display-country.textContent = country.value;
            display-message.textContent = message.value;

            let gender = document.querySelector('input[name="gender"]:checked');
            display-gender.textContent = gender ? gender.value : "Not selected";

            display-subscribe.textContent = subscribe.checked ? "Yes" : "No";

            document.querySelector(".main").style.display = "none";
            document.querySelector(".main2").style.display = "block";
        });
    </script>

    <br><br>
    <a href="https://shareeqshaikh.github.io/4-sem-fet/assignment/1.html">Home Page</a>

</body>
</html>

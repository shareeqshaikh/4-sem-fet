<!DOCTYPE html>
<html>
<head>
    <title>Layers Example</title>

    <style>
        .main {
            position: relative;
            width: 600px;
            height: 500px;
            margin: 20px auto;
        }

        .layer1 {
            position: absolute;
            background-color: red;
            width: 100px;
            height: 300px;
            left: 50px;
            top: 50px;
            z-index: 1;
        }

        .layer2 {
            position: absolute;
            background-color: green;
            width: 300px;
            height: 150px;
            left: 100px;
            top: 100px;
            z-index: 2;
        }

        .layer3 {
            position: absolute;
            background-color: yellow;
            width: 200px;
            height: 250px;
            left: 150px;
            top: 150px;
            z-index: 3;
        }

        button {
            padding: 10px;
            margin: 5px;
        }

        .buttons {
            text-align: center;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="main">
        <div class="layer1"></div>
        <div class="layer2"></div>
        <div class="layer3"></div>
    </div>

    <div class="buttons">
        <button id="red">Red Layer</button>
        <button id="green">Green Layer</button>
        <button id="yellow">Yellow Layer</button>
        <br><br>
        <a href="https://sachinacharya28.github.io/SEM-4-FET/assignments/one.html">Home Page</a>
    </div>

    <script>
        let layer1 = document.querySelector(".layer1");
        let layer2 = document.querySelector(".layer2");
        let layer3 = document.querySelector(".layer3");

        function bringFront(layer) {
            layer1.style.zIndex = 1;
            layer2.style.zIndex = 2;
            layer3.style.zIndex = 3;

            layer.style.zIndex = 10;
        }

        document.getElementById("red").onclick = function() {
            bringFront(layer1);
        };

        document.getElementById("green").onclick = function() {
            bringFront(layer2);
        };

        document.getElementById("yellow").onclick = function() {
            bringFront(layer3);
        };
    </script>

</body>
</html>

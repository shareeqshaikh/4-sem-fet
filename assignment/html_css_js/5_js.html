<!DOCTYPE html>
<html>
<head>
    <title>Skill Matrix</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .main {
            background-color: white;
            width: 70%;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: darkblue;
            margin-bottom: 5px;
        }

        .role-container {
            text-align: center;
            margin-bottom: 30px;
            font-size: 18px;
        }

        h2 {
            color: darkred;
        }

        ol li {
            margin-bottom: 20px;
        }

        ul {
            padding-left: 20px;
        }

        ul li {
            background-color: #eeeeee;
            margin: 8px 0;
            padding: 10px;
            border-radius: 5px;
        }

        button {
            margin-left: 10px;
            padding: 5px 10px;
            background-color: darkblue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: blue;
        }

        #home {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            background-color: darkblue;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
        }
    </style>

    <script>
        // Function to edit the skills
        function editSkill(id) {
            let skill = document.getElementById(id);
            let currentText = skill.firstChild.textContent;
            let newText = prompt("Edit Skill", currentText);

            if (newText != null && newText != "") {
                skill.firstChild.textContent = newText;
                alert("Skill updated successfully!");
            }
        }

        // Function to edit the job role
        function editrole(){
            const roleElement = document.getElementById('Role');
            const currentrole = roleElement.textContent;
            const newRole = prompt("Enter new role: ", currentrole);

            if (newRole != null && newRole.trim() !== ''){
                roleElement.textContent = newRole.trim();
                alert("Role updated successfully!");
            }
        }
    </script>
</head>

<body>

    <div class="main">

        <h1>Skill Matrix</h1>
        
        <!-- Added Role section here so the editrole function works -->
        <div class="role-container">
            <strong>Current Role:</strong> <span id="Role">Software Developer Intern</span>
            <button onclick="editrole()">Edit Role</button>
        </div>

        <ol>

            <li>
                <h2>Frontend Development</h2>

                <ul>
                    <li id="s1">
                        HTML - Intermediate
                        <button onclick="editSkill('s1')">Edit</button>
                    </li>

                    <li id="s2">
                        CSS - Intermediate
                        <button onclick="editSkill('s2')">Edit</button>
                    </li>

                    <li id="s3">
                        JavaScript - Intermediate
                        <button onclick="editSkill('s3')">Edit</button>
                    </li>
                </ul>
            </li>

            <li>
                <h2>Programming Languages</h2>

                <ul>
                    <li id="s4">
                        Java - Intermediate
                        <button onclick="editSkill('s4')">Edit</button>
                    </li>

                    <li id="s5">
                        C - Intermediate
                        <button onclick="editSkill('s5')">Edit</button>
                    </li>
                </ul>
            </li>

        </ol>

        <a id="home" href="https://shareeqshaikh.github.io/4-sem-fet/assignment/1.html">
            Home Page
        </a>

    </div>

</body>
</html>

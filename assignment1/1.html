<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portfolio</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #1e3c72, #2a5298);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            width: 400px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        h1 {
            margin-bottom: 10px;
        }

        h4 {
            margin-top: 0;
            font-weight: normal;
            color: #ddd;
        }

        p {
            line-height: 1.5;
        }

        .links {
            margin-top: 20px;
        }

        a {
            display: block;
            margin: 10px 0;
            text-decoration: none;
            padding: 10px;
            border-radius: 5px;
            background: #ffffff;
            color: #333;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            background: #ffd700;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="card">
        <h1 title="Name">Mohammed Shareeq</h1>
        <h4 title="Degree">Bachelor in Computer Science and Engineering</h4>

        <p title="Interest">
            I enjoy playing volleyball, listening to violin music, and watching suspense-worthy anime.
        </p>

        <p title="Details">
            Height: 6'2" <br>
            Weight: 67 kg
        </p>

        <div class="links">
            <a href="https://shareeqshaikh.github.io/4-sem-fet/index.html" target="_blank">
                Home Page
            </a>

            <a href="https://github.com/shareeqshaikh" target="_blank">
                GitHub Profile
            </a>
        </div>
    </div>

</body>
</html>
